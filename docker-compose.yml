version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: haptic_friends_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-haptic_friends}
      POSTGRES_USER: ${DB_USER:-haptic_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-haptic_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-haptic_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - haptic_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: haptic_friends_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - haptic_network

  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haptic_friends_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-haptic_friends}
      DB_USER: ${DB_USER:-haptic_user}
      DB_PASSWORD: ${DB_PASSWORD:-haptic_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APNS_KEY_PATH: ${APNS_KEY_PATH}
      APNS_KEY_ID: ${APNS_KEY_ID}
      APNS_TEAM_ID: ${APNS_TEAM_ID}
      APNS_TOPIC: ${APNS_TOPIC}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-false}
      CORS_ORIGIN: http://localhost:80,http://localhost
    expose:
      - "3000"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/keys:/app/keys:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - haptic_network

  # Web App
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: haptic_friends_webapp
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - haptic_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: haptic_friends_nginx
    restart: unless-stopped
    depends_on:
      - api
      - webapp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - haptic_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  haptic_network:
    driver: bridge
